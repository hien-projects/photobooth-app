<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snapshot">
<title>Snapshot Photobooth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF3EA;
    --panel:#F6E9DA;
    --panel-deep:#EFDCC6;
    --ink:#5B4A3F;
    --ink-soft:#A08A78;
    --blush:#E8AFAE;
    --blush-deep:#D48C8C;
    --line: rgba(91,74,63,0.14);
    --radius: 22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #FFFDF9 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:'Space Mono', monospace;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding: 28px 16px 60px;
  }
  .app{ width:100%; max-width:460px; }

  /* Header */
  .eyebrow{
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color: var(--blush-deep); text-align:center; opacity:.9;
  }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: 56px;
    letter-spacing: .04em;
    text-align:center;
    margin: 2px 0 4px;
    line-height: .95;
    color: var(--ink);
    text-shadow: 0 0 26px rgba(232,175,174,0.35);
  }
  .sub{
    text-align:center; font-size:12px; color: var(--ink-soft);
    margin-bottom: 22px;
  }
  .sub b{color:var(--blush-deep); font-weight:700;}

  /* Viewfinder — full screen, edge to edge */
  #boothScreen{ padding:0; background:#0a0908; }
  .viewfinder{
    position:relative;
    width:100%; height:100%;
    overflow:hidden;
    background:#0a0908;
  }
  .viewfinder video{
    width:100%; height:100%; object-fit:cover;
    transform: scaleX(-1);
    display:block;
  }
  .vf-message{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding: 24px; font-size:13px; color:#ECD9C9; line-height:1.6;
    cursor:pointer;
  }
  .flash-overlay{
    position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;
  }
  .flash-overlay.pop{ animation: flashpop .35s ease-out; }
  @keyframes flashpop{ 0%{opacity:.95;} 100%{opacity:0;} }

  .countdown{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue', sans-serif;
    font-size: 130px;
    color: var(--blush);
    text-shadow: 0 0 30px rgba(232,175,174,.7);
    opacity:0; pointer-events:none; transition: opacity .15s;
  }
  .countdown.show{opacity:1;}

  .frame-dots{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom: calc(32px + env(safe-area-inset-bottom, 0px));
    display:flex; justify-content:center; gap:8px;
    background: rgba(10,9,8,0.4);
    padding: 9px 14px;
    border-radius: 999px;
  }
  .dot{
    width:9px; height:9px; border-radius:50%;
    background: rgba(255,255,255,0.25);
    border:1px solid rgba(255,255,255,0.35);
    transition: background .25s, transform .25s;
  }
  .dot.filled{ background: var(--blush-deep); border-color: var(--blush-deep); transform: scale(1.15); }

  /* Strip section */
  .strip-label{
    font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--blush-deep);
    text-align:center; margin-bottom:10px;
  }

  .strip-empty{
    text-align:center; font-size:12px; color: rgba(91,74,63,0.4);
    border: 1px dashed var(--line); border-radius:14px; padding: 26px 16px;
  }
  canvas#stripCanvas{
    display:block; width:100%; max-width: min(92vw, 460px); margin: 0 auto;
    border-radius: 6px;
    box-shadow: 0 24px 50px -20px rgba(91,74,63,.3);
  }
  .strip-actions{
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:16px;
  }
  .btn{
    font-family:'Space Mono', monospace; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    padding: 12px 18px; border-radius: 10px; border:none; cursor:pointer;
  }
  .btn-primary{ background: var(--blush-deep); color:var(--bg); }
  .btn-secondary{ background: rgba(91,74,63,0.06); color:var(--ink); border:1px solid var(--line); }

  canvas#hiddenCanvas{ display:none; }

  /* Full-screen overlay steps (landing, frame picker). Height is set
     explicitly with dvh (not inset:0's implied 100%) so it tracks the
     browser's *visible* area as toolbars/nav bars show and hide — inset:0
     on a fixed element anchors to the full layout viewport instead, which
     is what let buttons end up hidden underneath a device's browser or
     gesture bar. overflow-y:auto is a safety net so content and buttons
     stay reachable (via scroll) even in the tightest viewport case. */
  .screen{
    position:fixed; top:0; left:0; right:0; z-index:50;
    height:100dvh;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(120% 90% at 50% -10%, #FFFDF9 0%, var(--bg) 55%);
    padding: 24px 24px calc(24px + env(safe-area-inset-bottom, 0px));
    overflow-y:auto;
    -webkit-overflow-scrolling: touch;
    transition: opacity .5s ease, visibility 0s linear 0s;
  }
  .screen.hide{
    opacity:0; visibility:hidden; pointer-events:none;
    transition: opacity .5s ease, visibility 0s linear .5s;
  }
  .landing-inner{ text-align:center; max-width:340px; }
  .landing-icon{
    width:84px; height:auto; margin:0 auto 8px; display:block;
    color: var(--blush-deep);
  }
  .landing-title{
    font-family:'Bebas Neue', sans-serif;
    font-size: 50px;
    line-height: .98;
    letter-spacing:.02em;
    color: var(--ink);
    margin: 6px 0 12px;
    text-shadow: 0 0 26px rgba(232,175,174,0.35);
  }
  .landing-sub{
    font-size:12px; color: var(--ink-soft); line-height:1.7;
    margin: 0 0 30px;
  }
  .tap-begin{
    font-family:'Bebas Neue', sans-serif;
    font-size:19px; letter-spacing:.08em;
    background: var(--blush-deep); color: var(--bg);
    border:none; padding:16px 42px; border-radius:999px; cursor:pointer;
    box-shadow: 0 16px 32px -12px rgba(212,140,140,.6);
    animation: tapPulse 2.4s ease-in-out infinite;
  }
  @keyframes tapPulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce){
    .tap-begin{ animation: none; }
  }
  /* Printing: only the finished strip goes to the printer, borderless 4x6. */
  /* Email panel */
  .email-panel{
    position:fixed; top:0; left:0; right:0; height:100dvh; z-index:60;
    display:flex; align-items:flex-start; justify-content:center;
    padding: max(48px, 12dvh) 20px 24px;
    background: rgba(91,74,63,0.35);
    overflow-y:auto;
  }
  .email-panel.hide{ display:none; }
  .email-card{
    width:100%; max-width:380px;
    background: var(--bg); border:1px solid var(--line); border-radius:18px;
    padding:22px 20px 18px; text-align:center;
    box-shadow: 0 24px 50px -20px rgba(91,74,63,.45);
  }
  .email-card h2{
    font-family:'Bebas Neue', sans-serif; font-weight:400; font-size:34px;
    letter-spacing:.03em; margin:0 0 4px; color:var(--ink);
  }
  .email-card p{ font-size:12px; color:var(--ink-soft); margin:0 0 16px; line-height:1.6; }
  .email-input{
    width:100%; font-family:'Space Mono', monospace; font-size:16px;
    padding:14px; border-radius:10px; border:1px solid var(--line);
    background:#fff; color:var(--ink); outline:none;
  }
  .email-input:focus{ border-color: var(--blush-deep); }
  .email-status{ min-height:20px; font-size:12px; margin:10px 0 4px; color:var(--ink-soft); }
  .email-status.error{ color:#B3452C; }
  .email-status.ok{ color:#4E7A4A; }
  .email-card .strip-actions{ margin-top:8px; }
  .btn:disabled{ opacity:.55; cursor:default; }

  #printArea{ display:none; }
  @page{ size: 4in 6in; margin: 0; }
  @media print{
    html, body{ margin:0 !important; padding:0 !important; background:#fff !important;
      min-height:0 !important; display:block !important; }
    body > *:not(#printArea){ display:none !important; }
    #printArea{ display:block !important; width:4in; height:6in; overflow:hidden; }
    #printImg{ display:block; width:4in; height:6in; object-fit:contain; }
  }

  /* Frame picker */
  .picker-inner{ text-align:center; max-width:380px; width:100%; }
  .frame-picker-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:14px; margin-top:24px;
  }
  .frame-card{
    font-family:'Space Mono', monospace;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .frame-card:hover, .frame-card:active{
    border-color: var(--blush-deep);
    transform: translateY(-2px);
    box-shadow: 0 14px 26px -16px rgba(91,74,63,.35);
  }
  .frame-card-thumb{
    width:100%; aspect-ratio:3/4; object-fit:cover;
    border-radius:10px; border:1px solid var(--line);
    display:block;
  }
  .frame-card-label{
    font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color: var(--ink);
  }
</style>
</head>
<body>
<div class="screen" id="landing">
  <div class="landing-inner">
    <svg class="landing-icon" viewBox="0 0 140 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="14" y="38" width="112" height="72" rx="12" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <rect x="48" y="18" width="30" height="20" rx="5" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="70" cy="76" r="24" stroke="currentColor" stroke-width="3"/>
      <circle cx="70" cy="76" r="10" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="108" cy="54" r="3" fill="currentColor"/>
    </svg>
    <div class="eyebrow">Snapshot Booth</div>
    <h1 class="landing-title">Welcome</h1>
    <p class="landing-sub">Step up, strike a pose, take one home.</p>
    <button class="tap-begin" id="tapBeginBtn">Tap to Begin</button>
  </div>
</div>

<div class="screen hide" id="framePicker">
  <div class="picker-inner">
    <div class="eyebrow">One More Thing</div>
    <h1 class="landing-title">Pick a<br>Frame</h1>
    <p class="landing-sub">Tap a frame to start the camera.</p>
    <div class="frame-picker-grid" id="frameGrid"></div>
  </div>
</div>

<div class="screen hide" id="boothScreen">
  <div class="viewfinder" id="viewfinder">
    <video id="video" playsinline autoplay muted></video>
    <div class="vf-message" id="vfMessage">Opening camera&hellip;</div>
    <div class="countdown" id="countdown">3</div>
    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="frame-dots" id="frameDots"></div>
  </div>
</div>

<div class="screen hide" id="resultsScreen">
  <div class="app">
    <div class="strip-label">Your Strip</div>

    <div class="strip-empty" id="stripEmpty">Nothing developed yet &mdash; press the button to print your strip.</div>
    <canvas id="stripCanvas" style="display:none;"></canvas>
    <div class="strip-actions" id="stripActions" style="display:none;">
      <button class="btn btn-primary" id="printBtn">Print Picture</button>
      <button class="btn btn-secondary" id="emailBtn">Email Picture</button>
      <button class="btn btn-secondary" id="newStripBtn">Retake Picture</button>
    </div>
  </div>
</div>

<div class="email-panel hide" id="emailPanel">
  <form class="email-card" id="emailForm" novalidate>
    <h2>Email Your Picture</h2>
    <p>Type your email address and we'll send you a copy.</p>
    <input class="email-input" id="emailInput" type="email" inputmode="email"
      placeholder="you@example.com" autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false">
    <div class="email-status" id="emailStatus"></div>
    <div class="strip-actions">
      <button class="btn btn-primary" id="emailSendBtn" type="submit">Send</button>
      <button class="btn btn-secondary" id="emailCancelBtn" type="button">Cancel</button>
    </div>
  </form>
</div>
<canvas id="hiddenCanvas"></canvas>
<div id="printArea"><img id="printImg" alt=""></div>

<script>

const countdownEl = document.getElementById('countdown');

const printBtn = document.getElementById('printBtn');

const hiddenCanvas = document.getElementById('hiddenCanvas');
let activeFrame = null;
const landing = document.getElementById('landing');

const framePicker = document.getElementById('framePicker');
const frameGrid = document.getElementById('frameGrid');
const boothScreen = document.getElementById('boothScreen');

const printImg = document.getElementById('printImg');

const emailPanel = document.getElementById('emailPanel');
const emailForm = document.getElementById('emailForm');

const EMAIL_SECRET = 'change-me';

  landing.classList.add('hide');
  framePicker.classList.remove('hide');
});

// Each frame: `image` + `slots` in the image's native pixel coordinates.
// photoCount drives the capture session. A slot's `photo` says which
// captured shot fills it, so one shot can appear in more than one slot.
// `overlay: true` means draw photos first, then the frame on top.
const PRESET_FRAMES = {
  // 4x6 sheet (1200x1800 = 4x6in at 300dpi) holding two identical strips
  // side by side, to be cut in half after printing. 3 windows per strip,
  // so 3 shots, each printed twice (left + right).
  carnival: {
    label: 'Boogeyman Bash Carnival',
    photoCount: 3,
    image: CARNIVAL_IMG,
    overlay: true,
    nativeW: 1200,
    nativeH: 1800,
    slots: [
      { photo: 0, x: 30,  y: 34,  w: 539, h: 414 },
      { photo: 1, x: 30,  y: 504, w: 539, h: 414 },
      { photo: 2, x: 30,  y: 974, w: 539, h: 414 },
      { photo: 0, x: 632, y: 34,  w: 539, h: 414 },
      { photo: 1, x: 632, y: 504, w: 539, h: 414 },
      { photo: 2, x: 632, y: 974, w: 539, h: 414 }
    ]
  }
};

function renderDots(count){
  frameDotsContainer.innerHTML = '';
  for(let i = 0; i < count; i++){
    const d = document.createElement('div');
    d.className = 'dot';
    frameDotsContainer.appendChild(d);
  }
}
function renderFramePicker(){
  frameGrid.innerHTML = '';
  Object.entries(PRESET_FRAMES).forEach(([key, frame]) => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'frame-card';

    const img = document.createElement('img');
    img.className = 'frame-card-thumb';
    img.src = frame.image;
    img.alt = frame.label || key;

    const label = document.createElement('span');
    label.className = 'frame-card-label';
    label.textContent = frame.label || key;

    card.appendChild(img);
    card.appendChild(label);
    card.addEventListener('click', () => selectFrame(key));
    frameGrid.appendChild(card);
  });
}
renderFramePicker();

function selectFrame(key){
  activeFrame = key;
  renderDots(PRESET_FRAMES[key].photoCount);
  framePicker.classList.add('hide');
  boothScreen.classList.remove('hide');
  startCamera();
}

async function startCamera(){
  try{
    vfMessage.textContent = 'Opening camera\u2026';
    vfMessage.style.display = 'flex';
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio:false });
    streamRef = stream;
    video.srcObject = stream;
    vfMessage.style.display = 'none';
    runSession();
  }catch(err){
    vfMessage.textContent = "Couldn't reach the camera. Check permissions in your browser settings, then tap to try again.";
    vfMessage.style.display = 'flex';
  }
}

vfMessage.addEventListener('click', () => {
  if(!streamRef) startCamera();
});

async function runSession(){
  const frame = PRESET_FRAMES[activeFrame];
  const count = frame.photoCount;
  shots = [];
  renderDots(count);
  const dots = frameDotsContainer.querySelectorAll('.dot');
  stripEmpty.style.display = 'block';
  stripEmpty.textContent = `Nothing developed yet — take ${count} photo${count > 1 ? 's' : ''} to print your strip.`;
  stripCanvas.style.display = 'none';
  stripActions.style.display = 'none';

  for(let i=0; i<count; i++){
    await countdown(3);
    capture();
    dots[i].classList.add('filled');
    await sleep(500);
  }
  await buildStrip();
  boothScreen.classList.add('hide');
  resultsScreen.classList.remove('hide');
  scheduleIdleReset();
}

let idleTimer = null;

function scheduleIdleReset(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(resetToLanding, 30000);
}

function clearIdleReset(){
  clearTimeout(idleTimer);
}

function resetToLanding(){
  clearIdleReset();
  if(streamRef){
    streamRef.getTracks().forEach(track => track.stop());
    streamRef = null;
  }
  video.srcObject = null;
  shots = [];
  activeFrame = null;
  printFile = null;
  closeEmailPanel();
  resultsScreen.classList.add('hide');
  boothScreen.classList.add('hide');
  framePicker.classList.add('hide');
  landing.classList.remove('hide');
}

function countdown(n){
  return new Promise(resolve => {
    let count = n;
    countdownEl.textContent = count;
    countdownEl.classList.add('show');
    const tick = setInterval(() => {
      count--;
      if(count <= 0){
        clearInterval(tick);
        countdownEl.classList.remove('show');
        resolve();
      } else {
        countdownEl.textContent = count;
      }
    }, 700);
  });
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function capture(){
  flashOverlay.classList.remove('pop');
  void flashOverlay.offsetWidth;
  flashOverlay.classList.add('pop');

  const vw = video.videoWidth, vh = video.videoHeight;
  hiddenCanvas.width = vw;
  hiddenCanvas.height = vh;
  const ctx = hiddenCanvas.getContext('2d');
  ctx.save();
  ctx.translate(vw, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, vw, vh);
  ctx.restore();
  shots.push(hiddenCanvas.toDataURL('image/jpeg', 0.92));
}

function drawImageCover(ctx, img, x, y, w, h){
  const imgRatio = img.width / img.height;
  const boxRatio = w / h;
  let sx, sy, sw, sh;
  if(imgRatio > boxRatio){
    sh = img.height;
    sw = sh * boxRatio;
    sx = (img.width - sw) / 2;
    sy = 0;
  } else {
    sw = img.width;
    sh = sw / boxRatio;
    sx = 0;
    sy = (img.height - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}


function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function buildStrip(){
  const frame = PRESET_FRAMES[activeFrame];
  const ctx = stripCanvas.getContext('2d');
  stripCanvas.width = frame.nativeW;
  stripCanvas.height = frame.nativeH;

  let frameImg = null;
  try{ frameImg = await loadImage(frame.image); }catch(err){}

  // Load each captured shot once, then reuse it for every slot it fills.
  const shotImgs = await Promise.all(shots.map(src => loadImage(src)));

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, frame.nativeW, frame.nativeH);

  if(frameImg && !frame.overlay){
    ctx.drawImage(frameImg, 0, 0, frame.nativeW, frame.nativeH);
  }

  frame.slots.forEach((slot, i) => {
    const idx = (slot.photo !== undefined) ? slot.photo : i;
    const img = shotImgs[idx];
    if(img) drawImageCover(ctx, img, slot.x, slot.y, slot.w, slot.h);
  });

  if(frameImg && frame.overlay){
    ctx.drawImage(frameImg, 0, 0, frame.nativeW, frame.nativeH);
  }

  stripEmpty.style.display = 'none';
  stripCanvas.style.display = 'block';
  stripActions.style.display = 'flex';
  await preparePrintCopy();
}

// ---- Print bleed -----------------------------------------------------------
// Borderless printing enlarges the image slightly so it runs off every edge of
// the paper, which trims a few mm from each side. To keep the actual design
// intact, the print copy shrinks the strip a little and fills the extra margin
// by stretching the frame's own outermost pixels outward (red border, stripes),
// so only that filler gets trimmed. Raise PRINT_BLEED_IN if edges are still
// cut off; lower it (or set 0) if you see the stretched filler on the print.
const PRINT_BLEED_IN = 0.12;   // inches of filler on each side (~3mm)
const PRINT_DPI = 300;         // strip is 1200x1800 = 4x6in at 300dpi

function makePrintCanvas(src){
  const W = src.width, H = src.height;
  const bleed = Math.round(PRINT_BLEED_IN * PRINT_DPI);
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  if(bleed <= 0){ ctx.drawImage(src, 0, 0); return out; }

  // Uniform scale so nothing is distorted; the tighter axis sets the scale.
  const scale = Math.min((W - 2*bleed) / W, (H - 2*bleed) / H);
  const iw = Math.round(W * scale), ih = Math.round(H * scale);
  const ix = Math.round((W - iw) / 2), iy = Math.round((H - ih) / 2);
  const e = 2; // source edge thickness (px) used for stretching
  const k = 6; // sample edges a few px in; the artwork's outermost px are fringed

  // Edges: stretch near-edge rows/columns into the margins.
  ctx.drawImage(src, k, 0, e, H,          0, iy, ix, ih);                 // left
  ctx.drawImage(src, W - k - e, 0, e, H,  ix + iw, iy, W - ix - iw, ih);  // right
  ctx.drawImage(src, 0, k, W, e,          ix, 0, iw, iy);                 // top
  ctx.drawImage(src, 0, H - k - e, W, e,  ix, iy + ih, iw, H - iy - ih);  // bottom
  // Corners.
  ctx.drawImage(src, k, k, e, e,                  0, 0, ix, iy);
  ctx.drawImage(src, W - k - e, k, e, e,          ix + iw, 0, W - ix - iw, iy);
  ctx.drawImage(src, k, H - k - e, e, e,          0, iy + ih, ix, H - iy - ih);
  ctx.drawImage(src, W - k - e, H - k - e, e, e,  ix + iw, iy + ih, W - ix - iw, H - iy - ih);
  // The design itself, slightly reduced, centered.
  ctx.drawImage(src, 0, 0, W, H, ix, iy, iw, ih);
  return out;
}

// iPhone/iPad (iPadOS reports itself as a Mac, so also check for touch).
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// The print copy (strip + bleed) is built as soon as the strip is ready, so
// the Print tap can hand it off immediately. iOS only opens the share sheet
// directly inside a tap, so no slow work can happen between the two.
let printFile = null;
async function preparePrintCopy(){
  const c = makePrintCanvas(stripCanvas);
  printImg.src = c.toDataURL('image/jpeg', 0.95);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.95));
  printFile = blob ? new File([blob], 'photo-strip.jpg', { type: 'image/jpeg' }) : null;
  try{ await printImg.decode(); }catch(err){}
}

// Printing:
//  - iOS: AirPrint forces margins on anything printed as a *web page*, but
//    prints *photos* borderless. So on iOS the strip goes to the share sheet
//    as an image; tapping Print there uses the photo path.
//  - Windows / Android: the system print dialog. The page's print CSS sends
//    only #printArea, sized to a borderless 4x6 sheet.
// Email still sends the original strip without the bleed.
printBtn.addEventListener('click', async () => {
  if(IS_IOS && printFile && navigator.canShare && navigator.canShare({ files: [printFile] })){
    clearIdleReset();
    try{
      await navigator.share({ files: [printFile] });
    }catch(err){
      // AbortError = guest closed the sheet; anything else, fall back below.
      if(err.name !== 'AbortError'){ window.print(); }
    }
    if(!resultsScreen.classList.contains('hide')) scheduleIdleReset();
    return;
  }
  if(!printImg.complete || !printImg.src){
    printImg.src = makePrintCanvas(stripCanvas).toDataURL('image/jpeg', 0.95);
    try{ await printImg.decode(); }catch(err){}
  }
  window.print();
});

// Don't let the 30s idle reset pull the page away while the print dialog
// is open; restart the countdown once it closes.
window.addEventListener('beforeprint', () => clearIdleReset());
window.addEventListener('afterprint', () => {
  if(!resultsScreen.classList.contains('hide')) scheduleIdleReset();
});

// ---- Email ---------------------------------------------------------------
function setEmailStatus(msg, kind){
  emailStatus.textContent = msg || '';
  emailStatus.className = 'email-status' + (kind ? ' ' + kind : '');
}

function openEmailPanel(){
  clearIdleReset(); // typing takes a while; don't reset mid-entry
  emailInput.value = '';
  setEmailStatus('');
  emailSendBtn.disabled = false;
  emailCancelBtn.disabled = false;
  emailPanel.classList.remove('hide');
  setTimeout(() => emailInput.focus(), 50);
}

function closeEmailPanel(){
  emailPanel.classList.add('hide');
  emailInput.value = ''; // never leave a guest's address on screen
  emailInput.blur();
  setEmailStatus('');
}

emailBtn.addEventListener('click', openEmailPanel);

emailInput.addEventListener('input', () => {
  if(emailStatus.classList.contains('error')) setEmailStatus('');
});

emailCancelBtn.addEventListener('click', () => {
  closeEmailPanel();
  scheduleIdleReset();
});

emailForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const to = emailInput.value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)){
    setEmailStatus("That email address doesn't look right.", 'error');
    return;
  }
  if(!EMAIL_SCRIPT_URL){
    setEmailStatus("Email isn't set up on this booth yet.", 'error');
    return;
  }

  emailSendBtn.disabled = true;
  emailCancelBtn.disabled = true;
  setEmailStatus('Sending\u2026');

  try{
    const image = stripCanvas.toDataURL('image/jpeg', 0.9).split(',')[1];
    // text/plain body keeps this a "simple" request, which Apps Script accepts
    // cross-origin without a CORS preflight.
    const res = await fetch(EMAIL_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ secret: EMAIL_SECRET, to, image })
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'send_failed');
    setEmailStatus('Sent! Check your inbox.', 'ok');
    setTimeout(() => { closeEmailPanel(); scheduleIdleReset(); }, 1800);
  }catch(err){
    console.warn('Email failed', err);
    setEmailStatus("Couldn't send right now. Please try again.", 'error');
    emailSendBtn.disabled = false;
    emailCancelBtn.disabled = false;
  }
});

newStripBtn.addEventListener('click', () => {
  clearIdleReset();
  resultsScreen.classList.add('hide');
  boothScreen.classList.remove('hide');
  runSession();
});
</script>
