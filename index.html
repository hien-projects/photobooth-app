<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snapshot">
<title>Snapshot Photobooth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF3EA;
    --panel:#F6E9DA;
    --panel-deep:#EFDCC6;
    --ink:#5B4A3F;
    --ink-soft:#A08A78;
    --blush:#E8AFAE;
    --blush-deep:#D48C8C;
    --line: rgba(91,74,63,0.14);
    --radius: 22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #FFFDF9 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:'Space Mono', monospace;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 28px 16px 60px;
  }
  .app{ width:100%; max-width:460px; }

  /* Header */
  .eyebrow{
    font-size:11px; letter-spacing:.28em; text-transform:uppercase;
    color: var(--blush-deep); text-align:center; opacity:.9;
  }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: 56px;
    letter-spacing: .04em;
    text-align:center;
    margin: 2px 0 4px;
    line-height: .95;
    color: var(--ink);
    text-shadow: 0 0 26px rgba(232,175,174,0.35);
  }
  .sub{
    text-align:center; font-size:12px; color: var(--ink-soft);
    margin-bottom: 22px;
  }
  .sub b{color:var(--blush-deep); font-weight:700;}

  /* Viewfinder — full screen, edge to edge */
  #boothScreen{ padding:0; background:#0a0908; }
  .viewfinder{
    position:relative;
    width:100vw; height:100dvh;
    overflow:hidden;
    background:#0a0908;
  }
  .viewfinder video{
    width:100%; height:100%; object-fit:cover;
    transform: scaleX(-1);
    display:block;
  }
  .vf-message{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding: 24px; font-size:13px; color:#ECD9C9; line-height:1.6;
    cursor:pointer;
  }
  .flash-overlay{
    position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;
  }
  .flash-overlay.pop{ animation: flashpop .35s ease-out; }
  @keyframes flashpop{ 0%{opacity:.95;} 100%{opacity:0;} }

  .countdown{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue', sans-serif;
    font-size: 130px;
    color: var(--blush);
    text-shadow: 0 0 30px rgba(232,175,174,.7);
    opacity:0; pointer-events:none; transition: opacity .15s;
  }
  .countdown.show{opacity:1;}

  .frame-dots{
    position:absolute; left:50%; bottom:32px; transform:translateX(-50%);
    display:flex; justify-content:center; gap:8px;
    background: rgba(10,9,8,0.4);
    padding: 9px 14px;
    border-radius: 999px;
  }
  .dot{
    width:9px; height:9px; border-radius:50%;
    background: rgba(255,255,255,0.25);
    border:1px solid rgba(255,255,255,0.35);
    transition: background .25s, transform .25s;
  }
  .dot.filled{ background: var(--blush-deep); border-color: var(--blush-deep); transform: scale(1.15); }

  /* Strip section */
  .strip-label{
    font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--blush-deep);
    text-align:center; margin-bottom:10px;
  }

  .strip-empty{
    text-align:center; font-size:12px; color: rgba(91,74,63,0.4);
    border: 1px dashed var(--line); border-radius:14px; padding: 26px 16px;
  }
  canvas#stripCanvas{
    display:block; width:100%; max-width: min(92vw, 460px); margin: 0 auto;
    border-radius: 6px;
    box-shadow: 0 24px 50px -20px rgba(91,74,63,.3);
  }
  .strip-actions{
    display:flex; justify-content:center; gap:10px; margin-top:16px;
  }
  .btn{
    font-family:'Space Mono', monospace; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    padding: 12px 18px; border-radius: 10px; border:none; cursor:pointer;
  }
  .btn-primary{ background: var(--blush-deep); color:var(--bg); }
  .btn-secondary{ background: rgba(91,74,63,0.06); color:var(--ink); border:1px solid var(--line); }

  canvas#hiddenCanvas{ display:none; }

  /* Full-screen overlay steps (landing, frame picker) */
  .screen{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(120% 90% at 50% -10%, #FFFDF9 0%, var(--bg) 55%);
    padding: 24px;
    transition: opacity .5s ease, visibility 0s linear 0s;
  }
  .screen.hide{
    opacity:0; visibility:hidden; pointer-events:none;
    transition: opacity .5s ease, visibility 0s linear .5s;
  }
  .landing-inner{ text-align:center; max-width:340px; }
  .balloon-art{
    width:84px; height:auto; margin:0 auto 8px; display:block;
    color: var(--blush-deep);
  }
  .landing-title{
    font-family:'Bebas Neue', sans-serif;
    font-size: 50px;
    line-height: .98;
    letter-spacing:.02em;
    color: var(--ink);
    margin: 6px 0 12px;
    text-shadow: 0 0 26px rgba(232,175,174,0.35);
  }
  .landing-sub{
    font-size:12px; color: var(--ink-soft); line-height:1.7;
    margin: 0 0 30px;
  }
  .tap-begin{
    font-family:'Bebas Neue', sans-serif;
    font-size:19px; letter-spacing:.08em;
    background: var(--blush-deep); color: var(--bg);
    border:none; padding:16px 42px; border-radius:999px; cursor:pointer;
    box-shadow: 0 16px 32px -12px rgba(212,140,140,.6);
    animation: tapPulse 2.4s ease-in-out infinite;
  }
  @keyframes tapPulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce){
    .tap-begin{ animation: none; }
  }

  /* Frame picker */
  .picker-inner{ text-align:center; max-width:380px; width:100%; }
  .frame-picker-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:14px; margin-top:24px;
  }
  .frame-card{
    font-family:'Space Mono', monospace;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .frame-card:hover, .frame-card:active{
    border-color: var(--blush-deep);
    transform: translateY(-2px);
    box-shadow: 0 14px 26px -16px rgba(91,74,63,.35);
  }
  .frame-card-thumb{
    width:100%; aspect-ratio:3/4; object-fit:cover;
    border-radius:10px; border:1px solid var(--line);
    display:block;
  }
  .frame-card-label{
    font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color: var(--ink);
  }
</style>
</head>
<body>
<div class="screen" id="landing">
  <div class="landing-inner">
    <svg class="balloon-art" viewBox="0 0 120 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M60 8C27 8 8 34 8 63c0 34 24 62 52 62s52-28 52-62c0-29-19-55-52-55z" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M54 123l6 11 6-11" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M60 136c-3 11-13 15-7 27s-7 19 1 29-3 21 5 33" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="eyebrow">You're Invited</div>
    <h1 class="landing-title">Nathan's<br>6th Birthday</h1>
    <p class="landing-sub">Step up, strike a pose, take one home.</p>
    <button class="tap-begin" id="tapBeginBtn">Tap to Begin</button>
  </div>
</div>

<div class="screen hide" id="framePicker">
  <div class="picker-inner">
    <div class="eyebrow">One More Thing</div>
    <h1 class="landing-title">Pick a<br>Frame</h1>
    <p class="landing-sub">Tap a frame to start the camera.</p>
    <div class="frame-picker-grid" id="frameGrid"></div>
  </div>
</div>

<div class="screen hide" id="boothScreen">
  <div class="viewfinder" id="viewfinder">
    <video id="video" playsinline autoplay muted></video>
    <div class="vf-message" id="vfMessage">Opening camera&hellip;</div>
    <div class="countdown" id="countdown">3</div>
    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="frame-dots" id="frameDots"></div>
  </div>
</div>

<div class="screen hide" id="resultsScreen">
  <div class="app">
    <div class="strip-label">Your Strip</div>

    <div class="strip-empty" id="stripEmpty">Nothing developed yet &mdash; press the button to print your strip.</div>
    <canvas id="stripCanvas" style="display:none;"></canvas>
    <div class="strip-actions" id="stripActions" style="display:none;">
      <button class="btn btn-primary" id="downloadBtn">Tear Off Strip</button>
      <button class="btn btn-secondary" id="newStripBtn">Start Over</button>
    </div>
  </div>
</div>

<canvas id="hiddenCanvas"></canvas>

      { x: 56, y: 75, w: 832, h: 922 }

  // each heart's artwork (big: x23-921 y182-991, left: x22-211 y865-1048,

      { x: 23, y: 182, w: 898, h: 809, shape: 'heart', points: HEART_BIG_PTS },
      { x: 22, y: 865, w: 189, h: 183, shape: 'heart', points: HEART_LEFT_PTS },

    ]

function renderDots(count){
  frameDotsContainer.innerHTML = '';
  for(let i = 0; i < count; i++){
    const d = document.createElement('div');
    d.className = 'dot';
    frameDotsContainer.appendChild(d);
  }
}
function renderFramePicker(){
  frameGrid.innerHTML = '';
  Object.entries(PRESET_FRAMES).forEach(([key, frame]) => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'frame-card';

    const img = document.createElement('img');
    img.className = 'frame-card-thumb';
    img.src = frame.image;
    img.alt = frame.label || key;

    const label = document.createElement('span');
    label.className = 'frame-card-label';
    label.textContent = frame.label || key;

    card.appendChild(img);
    card.appendChild(label);
    card.addEventListener('click', () => selectFrame(key));
    frameGrid.appendChild(card);
  });
}
renderFramePicker();

function selectFrame(key){
  activeFrame = key;
  renderDots(PRESET_FRAMES[key].photoCount);
  framePicker.classList.add('hide');
  boothScreen.classList.remove('hide');
  startCamera();
}

async function startCamera(){
  try{
    vfMessage.textContent = 'Opening camera\u2026';
    vfMessage.style.display = 'flex';
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio:false });
    streamRef = stream;
    video.srcObject = stream;
    vfMessage.style.display = 'none';
    runSession();
  }catch(err){
    vfMessage.textContent = "Couldn't reach the camera. Check permissions in your browser settings, then tap to try again.";
    vfMessage.style.display = 'flex';
  }
}

vfMessage.addEventListener('click', () => {
  if(!streamRef) startCamera();
});

async function runSession(){
  const frame = PRESET_FRAMES[activeFrame];
  const count = frame.photoCount;
  shots = [];
  renderDots(count);
  const dots = frameDotsContainer.querySelectorAll('.dot');
  stripEmpty.style.display = 'block';
  stripEmpty.textContent = `Nothing developed yet — take ${count} photo${count > 1 ? 's' : ''} to print your strip.`;
  stripCanvas.style.display = 'none';
  stripActions.style.display = 'none';

  for(let i=0; i<count; i++){
    await countdown(3);
    capture();
    dots[i].classList.add('filled');
    await sleep(500);
  }
  await buildStrip();
  boothScreen.classList.add('hide');
  resultsScreen.classList.remove('hide');
}

function countdown(n){
  return new Promise(resolve => {
    let count = n;
    countdownEl.textContent = count;
    countdownEl.classList.add('show');
    const tick = setInterval(() => {
      count--;
      if(count <= 0){
        clearInterval(tick);
        countdownEl.classList.remove('show');
        resolve();
      } else {
        countdownEl.textContent = count;
      }
    }, 700);
  });
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function capture(){
  flashOverlay.classList.remove('pop');
  void flashOverlay.offsetWidth;
  flashOverlay.classList.add('pop');

  const vw = video.videoWidth, vh = video.videoHeight;
  hiddenCanvas.width = vw;
  hiddenCanvas.height = vh;
  const ctx = hiddenCanvas.getContext('2d');
  ctx.save();
  ctx.translate(vw, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, vw, vh);
  ctx.restore();
  shots.push(hiddenCanvas.toDataURL('image/jpeg', 0.92));
}

function drawImageCover(ctx, img, x, y, w, h){
  const imgRatio = img.width / img.height;
  const boxRatio = w / h;
  let sx, sy, sw, sh;
  if(imgRatio > boxRatio){
    sh = img.height;
    sw = sh * boxRatio;
    sx = (img.width - sw) / 2;
    sy = 0;
  } else {
    sw = img.width;
    sh = sw / boxRatio;
    sx = 0;
    sy = (img.height - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}


// Traces a heart silhouette within the box (x, y, w, h), for clipping a
// photo into a heart-shaped slot. (x, y) is the box's top-left corner.
// `points` is a normalized (0-1) outline; defaults to the big heart's shape.
function heartPath(ctx, x, y, w, h, points){
  const pts = points || HEART_BIG_PTS;
  ctx.beginPath();
  pts.forEach(([nx, ny], i) => {
    const px = x + nx * w;
    const py = y + ny * h;
    if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath();
}

function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function buildStrip(){
  const frame = PRESET_FRAMES[activeFrame];
  const ctx = stripCanvas.getContext('2d');

  // Draw the frame artwork at native size, then drop each shot exactly into
  // its detected window. The frame's own branding/text is already part of
  // the image, so no extra footer text is added.
  stripCanvas.width = frame.nativeW;
  stripCanvas.height = frame.nativeH;
  try{
    const bg = await loadImage(frame.image);
    ctx.drawImage(bg, 0, 0, frame.nativeW, frame.nativeH);
  }catch(err){
    ctx.fillStyle = '#efe6d3';
    ctx.fillRect(0, 0, frame.nativeW, frame.nativeH);
  }
  for(let i = 0; i < frame.slots.length; i++){
    if(!shots[i]) continue;
    const slot = frame.slots[i];
    const img = await loadImage(shots[i]);
    if(slot.shape === 'heart'){
      ctx.save();
      heartPath(ctx, slot.x, slot.y, slot.w, slot.h, slot.points);
      ctx.clip();
      drawImageCover(ctx, img, slot.x, slot.y, slot.w, slot.h);
      ctx.restore();
    } else {
      drawImageCover(ctx, img, slot.x, slot.y, slot.w, slot.h);
    }
  }

  stripEmpty.style.display = 'none';
  stripCanvas.style.display = 'block';
  stripActions.style.display = 'flex';
}

downloadBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  link.download = `snapshot-strip-${stamp}.png`;
  link.href = stripCanvas.toDataURL('image/png');
  link.click();
});

newStripBtn.addEventListener('click', () => {
  resultsScreen.classList.add('hide');
  boothScreen.classList.remove('hide');
  runSession();
});
</script>
